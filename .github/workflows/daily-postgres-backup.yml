name: Daily PostgreSQL SQL backup

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      purpose:
        description: Backup purpose
        required: true
        default: pre-migration
        type: choice
        options:
          - pre-migration
          - daily

permissions:
  contents: read

concurrency:
  group: avs-daily-postgres-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GOOGLE_DRIVE_BACKUP_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_BACKUP_FOLDER_ID }}
      GOOGLE_DRIVE_OWNER_EMAIL: devanand.s2008@gmail.com
      BACKUP_ENCRYPTION_KEY_VERSION: "1"
      BACKUP_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.purpose == 'pre-migration' && 'PRE_MIGRATION' || 'DAILY' }}
      BACKUP_STATUS: ${{ github.event_name == 'workflow_dispatch' && inputs.purpose == 'pre-migration' && 'RESTORE_TESTED' || 'COMPLETED' }}
      POSTGRES_CLIENT_MAJOR: "17"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Mask and validate protected configuration
        id: protected
        shell: bash
        run: |
          set -euo pipefail
          for value in "$BACKUP_DATABASE_URL" "$BACKUP_ENCRYPTION_KEY"; do
            test -n "$value"
            echo "::add-mask::$value"
          done
          drive_enabled=true
          for value in "$GOOGLE_OAUTH_CLIENT_ID" "$GOOGLE_OAUTH_CLIENT_SECRET" "$GOOGLE_OAUTH_REFRESH_TOKEN" "$GOOGLE_DRIVE_BACKUP_FOLDER_ID"; do
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
            else
              drive_enabled=false
            fi
          done
          echo "drive_enabled=$drive_enabled" >> "$GITHUB_OUTPUT"

      - name: Install PostgreSQL client tools
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "postgresql-client-${POSTGRES_CLIENT_MAJOR}"
          pg_dump --version | tee /dev/stderr | grep -Eq "^pg_dump \(PostgreSQL\) ${POSTGRES_CLIENT_MAJOR}\."
          psql --version | tee /dev/stderr | grep -Eq "^psql \(PostgreSQL\) ${POSTGRES_CLIENT_MAJOR}\."

      - name: Create IST artifact names
        id: names
        shell: bash
        run: |
          set -euo pipefail
          work_dir="$RUNNER_TEMP/avs-backup-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          install -d -m 700 "$work_dir"
          timestamp="$(TZ=Asia/Kolkata date +'%Y-%m-%d_%H-%M-%S')"
          backup_id="avs-${timestamp}-IST"
          echo "BACKUP_WORK_DIR=$work_dir" >> "$GITHUB_ENV"
          echo "BACKUP_ID=$backup_id" >> "$GITHUB_ENV"
          echo "FULL_SQL=$work_dir/avs_portal_full_${timestamp}_IST.sql" >> "$GITHUB_ENV"
          echo "FULL_GZIP=$work_dir/avs_portal_full_${timestamp}_IST.sql.gz" >> "$GITHUB_ENV"
          echo "FULL_ENCRYPTED=$work_dir/avs_portal_full_${timestamp}_IST.sql.gz.enc" >> "$GITHUB_ENV"
          echo "SCHEMA_SQL=$work_dir/avs_portal_schema_${timestamp}_IST.sql" >> "$GITHUB_ENV"
          echo "MANIFEST=$work_dir/avs_portal_manifest_${timestamp}_IST.json" >> "$GITHUB_ENV"
          echo "CHECKSUM=$work_dir/avs_portal_checksum_${timestamp}_IST.sha256" >> "$GITHUB_ENV"
          echo "BACKUP_LOG=$work_dir/avs_portal_backup_log_${timestamp}_IST.json" >> "$GITHUB_ENV"

      - name: Generate readable full and schema SQL
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          pg_dump --format=plain --no-owner --no-privileges --clean --if-exists --encoding=UTF8 --file="$FULL_SQL" "$BACKUP_DATABASE_URL"
          pg_dump --schema-only --format=plain --no-owner --no-privileges --encoding=UTF8 --file="$SCHEMA_SQL" "$BACKUP_DATABASE_URL"
          test -s "$FULL_SQL"
          test -s "$SCHEMA_SQL"
          grep -Eq 'CREATE (TABLE|SCHEMA)' "$FULL_SQL"
          grep -Eq 'CREATE (TABLE|SCHEMA)' "$SCHEMA_SQL"
          grep -Eq '^(COPY|INSERT INTO) ' "$FULL_SQL"

      - name: Capture migration and table-count metadata
        shell: bash
        run: |
          set -euo pipefail
          migration="$(psql "$BACKUP_DATABASE_URL" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=on --command='SELECT migration_name FROM "_prisma_migrations" WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL ORDER BY finished_at DESC LIMIT 1')"
          counts="$(psql "$BACKUP_DATABASE_URL" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=on --command="
            SELECT json_object_agg(tablename, row_count ORDER BY tablename)::text
            FROM (
              SELECT
                tablename,
                ((xpath(
                  '/row/row_count/text()',
                  query_to_xml(
                    format('SELECT count(*) AS row_count FROM %I.%I', schemaname, tablename),
                    false,
                    true,
                    ''
                  )
                ))[1]::text)::bigint AS row_count
              FROM pg_tables
              WHERE schemaname = 'public'
            ) AS table_counts
          ")"
          test -n "$migration"
          node -e "const counts=JSON.parse(process.argv[1]);const values=Object.values(counts);if(!Number.isSafeInteger(counts._prisma_migrations)||values.length<1||values.some((value)=>!Number.isSafeInteger(value)||value<0))process.exit(1)" "$counts"
          echo "PRISMA_MIGRATION_VERSION=$migration" >> "$GITHUB_ENV"
          echo "BACKUP_TABLE_COUNTS_JSON=$counts" >> "$GITHUB_ENV"

      - name: Compress, encrypt, checksum, and build manifest
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          gzip -9 -c "$FULL_SQL" > "$FULL_GZIP"
          node scripts/backup-crypto.mjs encrypt "$FULL_GZIP" "$FULL_ENCRYPTED"
          sha256sum "$FULL_SQL" "$FULL_ENCRYPTED" "$SCHEMA_SQL" > "$CHECKSUM"
          node scripts/build-backup-manifest.mjs "$FULL_SQL" "$FULL_ENCRYPTED" "$SCHEMA_SQL" "$CHECKSUM" "$MANIFEST"
          test -s "$FULL_ENCRYPTED"
          test -s "$CHECKSUM"
          test -s "$MANIFEST"

      - name: Verify encrypted round trip
        shell: bash
        run: |
          set -euo pipefail
          verify_gzip="$BACKUP_WORK_DIR/verify.sql.gz"
          verify_sql="$BACKUP_WORK_DIR/verify.sql"
          node scripts/backup-crypto.mjs decrypt "$FULL_ENCRYPTED" "$verify_gzip"
          gzip -dc "$verify_gzip" > "$verify_sql"
          test "$(sha256sum "$FULL_SQL" | cut -d' ' -f1)" = "$(sha256sum "$verify_sql" | cut -d' ' -f1)"
          grep -Eq 'CREATE (TABLE|SCHEMA)' "$verify_sql"
          rm -f "$verify_gzip" "$verify_sql"

      - name: Verify pre-migration backup with an isolated restore
        if: env.BACKUP_TYPE == 'PRE_MIGRATION'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-sql-restore.sh "$FULL_ENCRYPTED" "$BACKUP_DATABASE_URL"

      - name: Record verified backup outcome
        shell: bash
        env:
          DRIVE_ENABLED: ${{ steps.protected.outputs.drive_enabled }}
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');fs.writeFileSync(process.env.BACKUP_LOG,JSON.stringify({backupId:process.env.BACKUP_ID,status:process.env.BACKUP_STATUS,uploadedProvider:process.env.DRIVE_ENABLED==='true'?'GITHUB_ACTIONS_AND_GOOGLE_DRIVE':'GITHUB_ACTIONS',verified:true,restoreTested:process.env.BACKUP_STATUS==='RESTORE_TESTED',finishedAt:new Date().toISOString()},null,2)+'\n',{mode:0o600})"

      - name: Upload encrypted private recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_ID }}
          path: |
            ${{ env.FULL_ENCRYPTED }}
            ${{ env.SCHEMA_SQL }}
            ${{ env.CHECKSUM }}
            ${{ env.MANIFEST }}
            ${{ env.BACKUP_LOG }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload privately to Google Drive and verify metadata
        if: steps.protected.outputs.drive_enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/google-drive-backup.mjs "$FULL_ENCRYPTED" "$SCHEMA_SQL" "$CHECKSUM" "$MANIFEST"

      - name: Register verified backup for migration readiness
        shell: bash
        run: |
          set -euo pipefail
          plain_sha256="$(sha256sum "$FULL_SQL" | awk '{print $1}')"
          encrypted_sha256="$(sha256sum "$FULL_ENCRYPTED" | awk '{print $1}')"
          manifest_sha256="$(sha256sum "$MANIFEST" | awk '{print $1}')"
          psql "$BACKUP_DATABASE_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=on \
            --set backup_type="$BACKUP_TYPE" \
            --set backup_status="$BACKUP_STATUS" \
            --set file_name="$(basename "$FULL_ENCRYPTED")" \
            --set plain_size="$(stat --format='%s' "$FULL_SQL")" \
            --set encrypted_size="$(stat --format='%s' "$FULL_ENCRYPTED")" \
            --set plain_sha256="$plain_sha256" \
            --set encrypted_sha256="$encrypted_sha256" \
            --set manifest_sha256="$manifest_sha256" \
            --set encryption_key_version="$BACKUP_ENCRYPTION_KEY_VERSION" \
            --set schema_version="$PRISMA_MIGRATION_VERSION" \
            --set application_commit="$GITHUB_SHA" \
            --set record_counts="$BACKUP_TABLE_COUNTS_JSON" \
            --file=scripts/register-external-backup.sql

      - name: Delete temporary unencrypted SQL and artifacts
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${BACKUP_WORK_DIR:-}" ] && [[ "$BACKUP_WORK_DIR" == "$RUNNER_TEMP"/avs-backup-* ]]; then
            find "$BACKUP_WORK_DIR" -type f -exec shred -u {} \; 2>/dev/null || true
            rm -rf -- "$BACKUP_WORK_DIR"
          fi
