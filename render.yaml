services:
  - type: web
    name: avs-college-api
    runtime: node
    rootDir: apps/api
    plan: starter
    autoDeploy: true
    buildCommand: cd ../.. && npm ci && npm run build -w @college/shared-types -w @college/validation && cd apps/api && npm run prisma:generate && npm run build
    startCommand: npm run prisma:deploy && npm run start:prod
    healthCheckPath: /api/v1/health/ready/dependencies
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: api/v1
      - key: TRUST_PROXY
        value: "1"
      - key: SWAGGER_ENABLED
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: CSRF_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: WEB_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: EMAIL_ENABLED
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: STUDENT_IMPORT_ENABLED
        value: "true"
      - key: FORCE_PASSWORD_CHANGE
        value: "true"
      - key: MAX_EXCEL_FILE_SIZE_MB
        value: "10"
      - key: MAX_EXCEL_ROWS
        value: "5000"

  - type: web
    name: avs-college-web
    runtime: node
    rootDir: apps/web
    plan: starter
    autoDeploy: true
    buildCommand: cd ../.. && npm ci && npm run build -w @college/shared-types -w @college/validation && cd apps/web && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: VITE_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_SOCKET_URL
        sync: false
