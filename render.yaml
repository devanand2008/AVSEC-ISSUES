services:
  - type: keyvalue
    name: avs-college-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: avs-college-portal
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Migration-related pushes run a protected backup check. Do not start a
    # deploy until that backup and the normal CI workflow have both succeeded.
    autoDeployTrigger: checksPass
    envVars:
      # ── Application identity ──────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: AVS College Management System
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
      - key: LOG_LEVEL
        value: info

      # ── Network and routing ───────────────────────────────────────────────────
      # WEB_URL, PUBLIC_APP_URL, and CORS_ALLOWED_ORIGINS automatically use
      # Render's RENDER_EXTERNAL_URL for this same-origin deployment.
      - key: API_PREFIX
        value: /api/v1
      - key: TRUST_PROXY
        value: "1"

      # ── Rate limiting (safe production defaults) ──────────────────────────────
      - key: GLOBAL_RATE_LIMIT_TTL_MS
        value: "60000"
      - key: GLOBAL_RATE_LIMIT_MAX
        value: "120"
      - key: LOGIN_RATE_LIMIT_TTL_MS
        value: "60000"
      - key: LOGIN_RATE_LIMIT_MAX
        value: "10"

      # ── Security ──────────────────────────────────────────────────────────────
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: SWAGGER_ENABLED
        value: "false"
      - key: SEED_DEVELOPMENT_DATA
        value: "false"

      # ── Database ──────────────────────────────────────────────────────────────
      # DATABASE_MODE: use EXTERNAL_PERSISTENT (recommended) for a persistent
      # PostgreSQL provider such as Supabase, Neon, or Railway.
      # Use RENDER_FREE_PILOT only for temporary 30-day pilot testing.
      - key: DATABASE_MODE
        value: EXTERNAL_PERSISTENT
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: MIGRATION_BACKUP_REQUIRED
        value: "true"
      # CI completes the protected backup before Render starts. This short poll
      # only covers database visibility or check-to-deploy propagation delay.
      - key: MIGRATION_BACKUP_WAIT_SECONDS
        value: "60"

      # ── JWT and auth secrets (generated and retained by Render) ───────────────
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: CSRF_SECRET
        generateValue: true
      - key: QR_TOKEN_SECRET
        generateValue: true
      - key: FEEDBACK_SUBMISSION_SECRET
        generateValue: true
      - key: BACKUP_TRIGGER_SECRET
        generateValue: true
      - key: PASSWORD_PEPPER
        generateValue: true
      # Temporary compatibility gate for credentials imported from the local
      # pre-pepper database. Successful logins are immediately re-hashed with
      # PASSWORD_PEPPER. This stays enabled during the controlled 2026-08-07
      # Supabase import and can be disabled after every migrated credential has
      # either logged in once or been reset.
      - key: LEGACY_UNPEPPERED_PASSWORD_MIGRATION_ENABLED
        value: "true"

      # ── Redis-compatible queue/cache ──────────────────────────────────────────
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: avs-college-redis
          property: connectionString

      # ── S3-compatible object storage ─────────────────────────────────────────
      # Required for profile photos, announcements, issue attachments, etc.
      # Compatible providers: Cloudflare R2, Backblaze B2, Supabase Storage.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"

      # ── Optional integrations ─────────────────────────────────────────────────
      - key: GOOGLE_DRIVE_ENABLED
        value: "false"
      - key: EMAIL_ENABLED
        value: "false"
      - key: WHATSAPP_ENABLED
        value: "false"
      - key: MALWARE_SCAN_ENABLED
        value: "false"

      # ── Backup encryption ─────────────────────────────────────────────────────
      - key: BACKUP_ENCRYPTION_KEY_VERSION
        value: "1"
      - key: BACKUP_SCHEDULE_ENABLED
        value: "false"
      - key: BACKUP_DAILY_RETENTION
        value: "30"
      - key: BACKUP_WEEKLY_RETENTION
        value: "12"
      - key: BACKUP_MONTHLY_RETENTION
        value: "12"

      # ── AVS Bot (optional) ────────────────────────────────────────────────────
      - key: AVS_BOT_ENABLED
        value: "false"

      # First production administrator. The password is used only if no Main
      # Admin exists yet, and the user must change it on first login.
      - key: DEVELOPMENT_COLLEGE_CODE
        value: "6201"
      - key: PRODUCTION_COLLEGE_NAME
        value: AVS Engineering College
      - key: PRODUCTION_ADMIN_IDENTITY_ID
        value: ADM001
      - key: DEVELOPMENT_ADMIN_NAME
        value: Main Administrator
      - key: DEVELOPMENT_ADMIN_EMAIL
        sync: false
      - key: DEVELOPMENT_ADMIN_PASSWORD
        sync: false
